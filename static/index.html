<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLIPIT — AI Video Clipper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Ambient Noise / Subtle Gradient Background -->
  <div class="ambient-glow"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <svg class="brand-svg" viewBox="0 0 32 32" fill="currentColor">
          <path d="M5.469 16.688l8.75-8.75c0.094-0.094 0.844-0.844 2.031-1.25 1.656-0.531 3.344-0.094 4.688 1.25 1.375 1.344 1.781 3 1.25 4.656-0.375 1.188-1.156 2-1.25 2.094l-9.406 9.406c-1.625 1.625-5.688 3.719-9.438 0-3.719-3.719-1.594-7.813 0-9.406l10.094-10.125c0.375-0.375 0.969-0.375 1.344 0s0.375 0.969 0 1.344l-10.063 10.125c-0.156 0.125-3.313 3.406 0 6.719 3.219 3.219 6.375 0.344 6.719 0l9.406-9.438s0.531-0.531 0.781-1.281c0.313-1 0.094-1.875-0.781-2.75-1.875-1.875-3.688-0.313-4.031 0l-8.75 8.719c-0.313 0.313-0.531 0.844 0 1.375s1.031 0.281 1.344 0l6.063-6.063c0.375-0.344 1-0.344 1.344 0 0.375 0.375 0.375 1 0 1.375l-6.063 6.031c-0.844 0.813-2.563 1.469-4.031 0-1.5-1.469-0.844-3.219 0-4.031z"/>
        </svg>
        <span class="brand-title">CLIPIT</span>
      </div>
      <div class="header-status">
        <span class="status-indicator"></span>
        <span class="status-label">ONLINE</span>
      </div>
    </div>
  </header>

  <!-- Main View -->
  <main class="main-content">
    
    <!-- Input Section -->
    <section class="panel input-panel">
      
      <!-- Mode Tabs -->
      <div class="tabs">
        <button id="tab-url" class="tab active" onclick="switchMode('url')">URL</button>
        <button id="tab-file" class="tab" onclick="switchMode('file')">FILE</button>
      </div>

      <!-- URL Input -->
      <div id="url-box" class="input-row">
        <input type="url" id="video-url" class="field text-field" placeholder="YouTube or Twitch URL" autocomplete="off" spellcheck="false">
      </div>

      <!-- File Dropzone -->
      <div id="file-box" class="input-row hidden">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
          <input type="file" id="file-input" class="hidden" accept="video/*" onchange="handleFile(event)">
          <div class="dropzone-text" id="dropzone-text">Drop video file here or click to browse</div>
        </div>
      </div>

      <!-- Settings Grid -->
      <div class="controls-grid">
        <div class="control">
          <label for="num-clips">CLIPS</label>
          <select id="num-clips" class="field select-field">
            <option value="1">1</option>
            <option value="3" selected>3</option>
            <option value="5">5</option>
            <option value="7">7</option>
          </select>
        </div>

        <div class="control">
          <label for="max-duration">DURATION</label>
          <select id="max-duration" class="field select-field">
            <option value="5">First 5m</option>
            <option value="10" selected>First 10m</option>
            <option value="20">First 20m</option>
            <option value="">Full</option>
          </select>
        </div>

        <div class="control">
          <label for="whisper-model">WHISPER</label>
          <select id="whisper-model" class="field select-field">
            <option value="tiny">Tiny</option>
            <option value="base" selected>Base</option>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
          </select>
        </div>

        <div class="control">
          <label for="llm-model">AI MODEL</label>
          <select id="llm-model" class="field select-field">
            <option value="openai/gpt-4o-mini" selected>GPT-4o Mini</option>
            <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 Free</option>
            <option value="deepseek/deepseek-chat">DeepSeek V3</option>
            <option value="openai/gpt-4o">GPT-4o</option>
            <option value="anthropic/claude-sonnet-4-5">Claude 3.5</option>
          </select>
        </div>
      </div>

      <!-- Action Button -->
      <button id="clip-btn" class="btn-clip" onclick="startClipping()">
        <span id="clip-btn-text">CLIP</span>
        <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </section>

    <!-- Real-time Progress (Minimalist Tracker) -->
    <section id="progress-panel" class="panel progress-panel hidden">
      <div class="progress-info">
        <div class="progress-state">
          <span class="pulse-indicator"></span>
          <span id="progress-step-text" class="progress-step-text">PROCESSING</span>
        </div>
        <span id="progress-val" class="progress-val">0%</span>
      </div>

      <div class="meter">
        <div id="meter-fill" class="meter-fill" style="width: 5%;"></div>
      </div>

      <div class="pipeline-track">
        <div id="p-prep" class="p-node active">PREP</div>
        <div id="p-transcribe" class="p-node">TRANSCRIBE</div>
        <div id="p-moments" class="p-node">MOMENTS</div>
        <div id="p-score" class="p-node">SCORE</div>
        <div id="p-render" class="p-node">RENDER</div>
      </div>

      <div id="log-box" class="log-box">
        <div class="log-row text-dim">[00:00:00] Initializing pipeline...</div>
      </div>
    </section>

    <!-- Output Gallery -->
    <section class="gallery-section">
      <div class="gallery-bar">
        <div class="gallery-tag">OUTPUTS</div>
        <button class="btn-refresh" onclick="fetchClips(true)" title="Refresh gallery">REFRESH</button>
      </div>

      <div id="clips-grid" class="clips-grid">
        <!-- Injected dynamically -->
      </div>

      <div id="empty-state" class="empty-state hidden">
        <svg class="empty-icon" viewBox="0 0 32 32" fill="currentColor">
          <path d="M5.469 16.688l8.75-8.75c0.094-0.094 0.844-0.844 2.031-1.25 1.656-0.531 3.344-0.094 4.688 1.25 1.375 1.344 1.781 3 1.25 4.656-0.375 1.188-1.156 2-1.25 2.094l-9.406 9.406c-1.625 1.625-5.688 3.719-9.438 0-3.719-3.719-1.594-7.813 0-9.406l10.094-10.125c0.375-0.375 0.969-0.375 1.344 0s0.375 0.969 0 1.344l-10.063 10.125c-0.156 0.125-3.313 3.406 0 6.719 3.219 3.219 6.375 0.344 6.719 0l9.406-9.438s0.531-0.531 0.781-1.281c0.313-1 0.094-1.875-0.781-2.75-1.875-1.875-3.688-0.313-4.031 0l-8.75 8.719c-0.313 0.313-0.531 0.844 0 1.375s1.031 0.281 1.344 0l6.063-6.063c0.375-0.344 1-0.344 1.344 0 0.375 0.375 0.375 1 0 1.375l-6.063 6.031c-0.844 0.813-2.563 1.469-4.031 0-1.5-1.469-0.844-3.219 0-4.031z"/>
        </svg>
        <div class="empty-text">NO CLIPS YET</div>
      </div>
    </section>
  </main>

  <!-- Minimal Toast -->
  <div id="toast" class="toast hidden">
    <span id="toast-text"></span>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
